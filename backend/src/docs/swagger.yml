openapi: 3.0.3
info:
  title: G Speed Bintaro - Bengkel API
  description: |
    API untuk manajemen bengkel **G Speed Bintaro** — spesialis Vespa.
    
    ## Fitur Utama
    - 🔐 Autentikasi (Login JWT Dev / Magic Link Prod)
    - 👥 Manajemen pengguna (Admin, Kasir, Mekanik)
    - 👤 Manajemen pelanggan & kendaraan
    - 📦 Manajemen produk (sparepart & service)
    - 📋 Manajemen pesanan & pembayaran (Cash & QRIS via Midtrans)
    - 💰 Manajemen shift kasir
    - 📊 Manajemen stok & pengeluaran
    - 🔧 Penugasan mekanik
    - 📈 Laporan, dashboard & customer insight
    - 🔔 Notifikasi real-time
    - 🤖 AI Agent/Chatbot (G-Speed Copilot)
    
    ## Autentikasi
    - **Development**: Login dengan email → JWT Token
    - **Production**: Magic Link via Supabase Auth → JWT Token
    
    ## Role
    | Role | Deskripsi |
    |------|-----------|
    | **ADMIN** | Akses penuh — kelola semua data, lihat laporan & dashboard |
    | **CASHIER** | Kelola pesanan, pembayaran, shift, pelanggan |
    | **MECHANIC** | Lihat & kerjakan task, lihat riwayat kerja |
  version: 1.0.0
  contact:
    name: Developer
    email: h3ykyy@gmail.com

servers:
  - url: http://localhost:3000/api/v1
    description: 🔧 Development Server
  - url: https://bengkel-ucu0.onrender.com
    description: 🚀 Production Server

tags:
  - name: Auth
    description: Autentikasi pengguna (Login & Validasi Email)
  - name: Users
    description: Manajemen pengguna (CRUD + bulk deactivate/activate)
  - name: Customers
    description: Manajemen pelanggan (CRUD + bulk delete)
  - name: Vehicles
    description: Manajemen kendaraan pelanggan
  - name: Products
    description: Manajemen produk sparepart & service (CRUD + bulk activate/deactivate)
  - name: Orders
    description: Manajemen pesanan (CRUD + bulk close/cancel)
  - name: Payments
    description: Manajemen pembayaran — Cash & QRIS via Midtrans
  - name: Expenses
    description: Manajemen pengeluaran (CRUD + bulk delete)
  - name: Shifts
    description: Manajemen shift kasir (open/close + cash flow)
  - name: Stock
    description: Manajemen stok sparepart (in/out/adjust + bulk delete)
  - name: Tasks
    description: Penugasan mekanik (assign/start/complete + bulk)
  - name: Reports
    description: Laporan & dashboard — sales, profit-loss, inventory, customers, mechanics, vehicles
  - name: Notifications
    description: Manajemen notifikasi (CRUD + bulk + mark read)
  - name: Settings
    description: Pengaturan aplikasi (key-value)
  - name: Agent
    description: 🤖 G-Speed Copilot — AI asisten bengkel
  - name: Health
    description: Pemeriksaan kesehatan sistem

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Nomor halaman
    LimitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Jumlah item per halaman
    PeriodParam:
      in: query
      name: period
      schema:
        type: string
        enum: [daily, weekly, monthly, yearly]
        default: monthly
      description: Periode laporan
    ReferenceDateParam:
      in: query
      name: referenceDate
      schema:
        type: string
        format: date
      description: "Tanggal referensi (default: hari ini)"

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: object
          properties:
            code:
              type: integer
            type:
              type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    LoginRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: admin@bengkel.com

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/UserResponse"
            tokens:
              type: object
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string

    EmailValidationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    EmailValidationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            isActive:
              type: boolean
            isAuthenticated:
              type: boolean

    UserSimple:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [ADMIN, CASHIER, MECHANIC]
        isActive:
          type: boolean
        isAuthenticated:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerSimple:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
          nullable: true

    CustomerResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/VehicleSimple"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderSimple"
        _count:
          type: object
          properties:
            vehicles:
              type: integer
            orders:
              type: integer

    VehicleSimple:
      type: object
      properties:
        id:
          type: string
        plateNumber:
          type: string
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true

    VehicleResponse:
      type: object
