security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login dengan email
      description: |
        Login untuk mendapatkan JWT access token dan refresh token.
        
        **Development**: Langsung generate JWT token
        **Production**: Verifikasi via Supabase Magic Link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Bad Request
        "404":
          description: User tidak ditemukan
        "403":
          description: Akun tidak aktif

  /auth/validate/email:
    post:
      tags: [Auth]
      summary: Validasi email user
      description: Memvalidasi apakah email terdaftar, aktif, dan terautentikasi
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailValidationRequest"
      responses:
        "200":
          description: Email valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailValidationResponse"
        "400":
          description: Bad Request
        "404":
          description: Email tidak terdaftar
        "403":
          description: Akun tidak aktif atau belum terautentikasi

  /health:
    get:
      tags: [Health]
      summary: Periksa kesehatan sistem
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /users:
    post:
      tags: [Users]
      summary: Buat user baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName]
              properties:
                email:
                  type: string
                  format: email
                fullName:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                  enum: [CASHIER, MECHANIC]
                  default: CASHIER
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "409":
          description: Conflict
    get:
      tags: [Users]
      summary: Daftar user
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
            enum: [ADMIN, CASHIER, MECHANIC]
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        "200":
          description: OK

