        id:
          type: string
        plateNumber:
          type: string
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        customer:
          $ref: "#/components/schemas/CustomerSimple"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderSimple"
        _count:
          type: object
          properties:
            orders:
